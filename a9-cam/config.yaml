name: A9 Camera
version: 3.1.4
slug: a9-cam
description: Local server for A9 / V720 mini cameras, no cloud
url: https://github.com/dbuezas/a9-camera-ha-add-on
image: ghcr.io/dbuezas/{arch}-a9-cam
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
startup: application
host_network: true
ingress: true
ingress_port: 8557
panel_icon: mdi:cctv
discovery:
  - a9_cam
ports:
  80/tcp: 80
  6123/tcp: 6123
  6123/udp: 6123
  8556/tcp: 8556
  8557/tcp: 8557
ports_description:
  80/tcp: Cloud API for the cameras (they always call port 80)
  6123/tcp: Camera control channel
  6123/udp: Camera video and audio
  8556/tcp: RTSP (MJPEG video + PCMA audio)
  8557/tcp: Web UI, MJPEG, snapshots and the integration API
options:
  log_level: info
  camera_http_port: 80
schema:
  log_level: list(trace|debug|info|warn|error)
  camera_http_port: int(0,65535)
